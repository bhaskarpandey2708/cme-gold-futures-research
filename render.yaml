services:
  - type: web
    name: cme-multi-commodity-cockpit
    runtime: python
    buildCommand: "pip install -r requirements.txt aiohttp"
    startCommand: "python3 scripts/quant_api_server.py"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/v1/health
